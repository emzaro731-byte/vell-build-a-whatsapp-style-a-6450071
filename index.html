<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WhatsApp‑Style Chat App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --primary:#075E54;
  --primary-light:#128C7E;
  --bg:#ECE5DD;
  --msg-in:#DCF8C6;
  --msg-out:#FFFFFF;
  --text:#303030;
  --muted:#777;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:system-ui,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--primary);
  color:#fff;
  padding:0.5rem 1rem;
  display:flex;
  align-items:center;
  gap:0.5rem;
}
header h1{
  font-size:1.2rem;
  flex:1;
}
header button{
  background:none;
  border:none;
  color:#fff;
  font-size:1.2rem;
  cursor:pointer;
}
.container{
  flex:1;
  display:flex;
  overflow:hidden;
}
aside{
  width:260px;
  max-width:80%;
  background:#fff;
  border-right:1px solid #ddd;
  overflow-y:auto;
  transition:transform .3s ease;
}
aside.hidden{
  transform:translateX(-100%);
}
aside ul{
  list-style:none;
}
aside li{
  display:flex;
  align-items:center;
  gap:0.75rem;
  padding:0.75rem 1rem;
  cursor:pointer;
}
aside li:hover,
aside li[aria-selected="true"]{
  background:#f0f0f0;
}
aside img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}
aside .name{
  font-weight:600;
}
aside .last{
  font-size:0.85rem;
  color:var(--muted);
}
main{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}
.chat-header{
  background:#fff;
  padding:0.75rem 1rem;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:0.75rem;
}
.chat-header img{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
}
.chat-header .info{
  flex:1;
}
.chat-header .info h2{
  font-size:1rem;
  margin-bottom:0.2rem;
}
.chat-header .info p{
  font-size:0.85rem;
  color:var(--muted);
}
.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:0.5rem;
}
.message{
  max-width:70%;
  padding:0.5rem 0.75rem;
  border-radius:0.75rem;
  line-height:1.4;
  word-wrap:break-word;
}
.message.incoming{
  background:var(--msg-in);
  align-self:flex-start;
}
.message.outgoing{
  background:var(--msg-out);
  align-self:flex-end;
}
.message time{
  display:block;
  font-size:0.7rem;
  color:var(--muted);
  margin-top:0.25rem;
  text-align:right;
}
.chat-input{
  display:flex;
  padding:0.5rem;
  background:#fff;
  border-top:1px solid #ddd;
}
.chat-input textarea{
  flex:1;
  resize:none;
  border:1px solid #ccc;
  border-radius:0.5rem;
  padding:0.5rem;
  font-family:inherit;
}
.chat-input button{
  background:var(--primary);
  border:none;
  color:#fff;
  padding:0 1rem;
  margin-left:0.5rem;
  border-radius:0.5rem;
  cursor:pointer;
}
@media (max-width:768px){
  aside{
    position:absolute;
    z-index:2;
    height:100%;
    background:#fff;
  }
  aside.hidden{
    transform:translateX(-100%);
  }
  .container{
    position:relative;
  }
}
</style>
</head>
<body>
<header>
  <button id="menuBtn" aria-label="Toggle contacts list">&#9776;</button>
  <h1>ChatApp</h1>
</header>
<div class="container">
  <aside id="contactList" aria-label="Contact list">
    <ul id="contacts">
      <!-- Contacts will be injected by JS -->
    </ul>
  </aside>
  <main>
    <section class="chat-header" aria-label="Chat header">
      <img id="chatAvatar" src="" alt="">
      <div class="info">
        <h2 id="chatName"></h2>
        <p id="chatStatus">online</p>
      </div>
    </section>
    <section class="chat-messages" id="messages" aria-live="polite" aria-atomic="false">
      <!-- Messages will appear here -->
    </section>
    <form class="chat-input" id="msgForm" aria-label="Send message">
      <textarea id="msgInput" rows="1" placeholder="Type a message" aria-label="Message input"></textarea>
      <button type="submit" aria-label="Send">Send</button>
    </form>
  </main>
</div>

<script>
const sampleContacts = [
  {id:1, name:"Alice", avatar:"https://i.pravatar.cc/150?img=1", last:"Hey, how are you?"},
  {id:2, name:"Bob", avatar:"https://i.pravatar.cc/150?img=2", last:"See you tomorrow."},
  {id:3, name:"Charlie", avatar:"https://i.pravatar.cc/150?img=3", last:"👍"},
  {id:4, name:"Diana", avatar:"https://i.pravatar.cc/150?img=4", last:"Let's meet at 5."}
];

const sampleMessages = {
  1: [
    {type:"incoming", text:"Hey, how are you?", time:"10:02 AM"},
    {type:"outgoing", text:"I’m good, thanks!", time:"10:03 AM"}
  ],
  2: [
    {type:"incoming", text:"See you tomorrow.", time:"Yesterday"},
  ],
  3: [
    {type:"incoming", text:"👍", time:"Mon"},
  ],
  4: [
    {type:"incoming", text:"Let's meet at 5.", time:"Tue"},
  ]
};

let currentChatId = null;

function renderContacts(){
  const ul=document.getElementById('contacts');
  ul.innerHTML='';
  sampleContacts.forEach(c=>{
    const li=document.createElement('li');
    li.setAttribute('role','button');
    li.setAttribute('tabindex','0');
    li.dataset.id=c.id;
    li.innerHTML=`
      <img src="${c.avatar}" alt="${c.name} avatar">
      <div>
        <div class="name">${c.name}</div>
        <div class="last">${c.last}</div>
      </div>
    `;
    li.addEventListener('click',()=>selectChat(c.id));
    li.addEventListener('keydown',e=>{if(e.key==="Enter") selectChat(c.id);});
    ul.appendChild(li);
  });
}
function selectChat(id){
  currentChatId=id;
  const contact=sampleContacts.find(c=>c.id===id);
  document.getElementById('chatAvatar').src=contact.avatar;
  document.getElementById('chatAvatar').alt=`${contact.name} avatar`;
  document.getElementById('chatName').textContent=contact.name;
  document.getElementById('chatStatus').textContent='online';
  // highlight selected
  document.querySelectorAll('aside li').forEach(li=>li.setAttribute('aria-selected','false'));
  const sel=document.querySelector(`aside li[data-id="${id}"]`);
  if(sel) sel.setAttribute('aria-selected','true');
  // load messages
  renderMessages(sampleMessages[id]||[]);
  // hide contacts on small screens
  if(window.innerWidth<=768) toggleContactList(true);
}
function renderMessages(msgs){
  const container=document.getElementById('messages');
  container.innerHTML='';
  msgs.forEach(m=>{
    const div=document.createElement('div');
    div.className=`message ${m.type}`;
    div.innerHTML=`${escapeHTML(m.text)}<time>${m.time}</time>`;
    container.appendChild(div);
  });
  container.scrollTop=container.scrollHeight;
}
function escapeHTML(str){
  const p=document.createElement('p');
  p.textContent=str;
  return p.innerHTML;
}
document.getElementById('msgForm').addEventListener('submit',e=>{
  e.preventDefault();
  const txt=document.getElementById('msgInput');
  const text=txt.value.trim();
  if(!text||!currentChatId) return;
  const now=new Date();
  const time=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const newMsg={type:"outgoing", text, time};
  // add to UI
  const container=document.getElementById('messages');
  const div=document.createElement('div');
  div.className='message outgoing';
  div.innerHTML=`${escapeHTML(text)}<time>${time}</time>`;
  container.appendChild(div);
  container.scrollTop=container.scrollHeight;
  // store
  if(!sampleMessages[currentChatId]) sampleMessages[currentChatId]=[];
  sampleMessages[currentChatId].push(newMsg);
  txt.value='';
  txt.focus();
});
function toggleContactList(forceHide){
  const aside=document.getElementById('contactList');
  if(forceHide===true){
    aside.classList.add('hidden');
    return;
  }
  aside.classList.toggle('hidden');
}
document.getElementById('menuBtn').addEventListener('click',()=>toggleContactList());
window.addEventListener('resize',()=>{
  if(window.innerWidth>768){
    document.getElementById('contactList').classList.remove('hidden');
  }
});
/* Init */
renderContacts();
if(sampleContacts.length) selectChat(sampleContacts[0].id);
</script>
</body>
</html>
